
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
        <p>Faculty Feedback & Course Evaluation</p>
    </header>

    <main class="container">
        <h2>Feedback Overview</h2>

        <div class="stats">
            <div class="stat-card">
                <p>Total Responses</p>
                <h3 id="totalFeedback">0</h3>
            </div>

            <div class="stat-card">
                <p>Overall Average</p>
                <h3 id="averageRating">0.0 / 5</h3>
            </div>
        </div>

        <hr>

        <h2>Course-wise Analysis</h2>
        <div id="courseReport">
            <p>No feedback submitted yet.</p>
        </div>

        <hr>

        <h2>Faculty-wise Analysis</h2>
        <div id="facultyReport">
            <p>No feedback submitted yet.</p>
        </div>

        <hr>

        <h2>Submitted Feedback</h2>
        <div id="feedbackList">
            <p>No feedback submitted yet.</p>
        </div>

        <button type="button" onclick="logout()">Logout</button>
    </main>

    <script src="admin.js"></script>
</body>
</html>
